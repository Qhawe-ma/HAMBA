<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<title>Hamba — Greytown delivery</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F4">
<meta name="description" content="Groceries and takeaways from shops in Greytown, delivered.">
<link rel="icon" href="/img/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header id="nav"></header>
<main id="view" tabindex="-1"></main>
<footer>
  <div class="wrap">
    <div>
      <b class="brand-name">hamba</b>
      <p>Groceries and takeaways from shops in Greytown, delivered.</p>
    </div>
    <div>
      <b>Delivering in</b>
      <p>Greytown now. Kranskop, Mooi River, Dundee and Estcourt next.</p>
    </div>
    <div>
      <b>Work with us</b>
      <p><a href="mailto:hello@hamba.co.za">List your shop</a><br><a href="mailto:hello@hamba.co.za">Become a driver</a></p>
    </div>
  </div>
</footer>
<div id="toast" role="status"></div>
<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title">Start a new basket?</h2>
  <p id="confirm-copy"></p>
  <div class="dialog-actions">
    <button type="button" class="btn quiet" data-act="switch-no">Keep current basket</button>
    <button type="button" class="btn primary" data-act="switch-ok">Start new basket</button>
  </div>
</dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
